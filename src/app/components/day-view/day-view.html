<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8">
  <h2>Day View</h2>

  @if (error()) {
    <div style="color: red">Error: {{ error() }}</div>
  }

  <table border="1" cellpadding="5" style="border-collapse: collapse">
    <thead>
      <tr>
        @for (key of objectKeys(data()[0]); track key) {
          <th>{{ key }}</th>
        }
      </tr>
    </thead>
    <tbody>
      @for (row of data(); track row) {
        <tr>
          @for (value of objectValues(row); track $index) {
            <td>{{ value }}</td>
          }
        </tr>
      }
    </tbody>
  </table>

  <div style="background: white; padding: 20px; border-radius: 8px">
    @if (chartOptions(); as options) {
      <apx-chart
        [series]="options.series!"
        [chart]="options.chart!"
        [xaxis]="options.xaxis!"
        [yaxis]="options.yaxis!"
        [title]="options.title!"
      >
      </apx-chart>
    } @else {
      <p>Loading chart data from DuckDB...</p>
    }
  </div>
</div>
