@if (chartConfiguration(); as config) {
  <div id="chart">
    <apx-chart
      class="[&_.apexcharts-heatmap-rect]:cursor-pointer"
      [series]="config.series"
      [chart]="config.chart"
      [plotOptions]="config.plotOptions"
      [title]="title"
    >
    </apx-chart>
    <p class="text-sm text-slate-500 font-normal mt-1 mb-4 max-w-2xl">
      This heatmap illustrates where data is missing. You can click on a block to view the data for
      that day.
    </p>
  </div>
}
