<div class="w-full px-4 sm:px-8 lg:px-12 py-6 sm:py-8">
  <h2 class="text-3xl font-bold tracking-tight text-slate-900 mb-6 sm:mb-8">
    Air Quality Explorer
  </h2>

  <p class="mb-6">
    Data is taken from
    <a
      href="https://www.airqualityengland.co.uk/site/latest?site_id=HS4"
      target="_blank"
      class="text-blue-600 hover:text-blue-800 font-medium underline decoration-sky-500/30 hover:decoration-blue-800 transition-colors"
      >Air Quality England</a
    >
    for Hounslow Chiswick (HS4).
  </p>

  <div class="mb-6">
    <mat-form-field appearance="outline">
      <mat-label>Choose a date</mat-label>
      <input
        matInput
        [matDatepicker]="picker"
        [value]="selectedDate()"
        (dateChange)="onDateChange($event.value)"
      />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>

  <app-day-view [date]="selectedDate()"></app-day-view>

  <app-aqi-heatmap
    (dateChange)="onDateChange($event)"
    [activeDate]="selectedDate()"
  ></app-aqi-heatmap>

  <app-data-density
    (dateChange)="onDateChange($event)"
    [activeDate]="selectedDate()"
  ></app-data-density>

  <app-series-comparison [date]="selectedDate()"></app-series-comparison>
</div>
