<div class="mx-auto max-w-7xl px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
  <h2 class="text-3xl font-bold tracking-tight text-slate-900 mb-6 sm:mb-8">AirQuality Explorer</h2>

  <div class="mb-6">
    <mat-form-field appearance="outline">
      <mat-label>Choose a date</mat-label>
      <input
        matInput
        [matDatepicker]="picker"
        [value]="selectedDate()"
        (dateChange)="onDateChange($event.value)"
      />
      <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
      <mat-datepicker #picker></mat-datepicker>
    </mat-form-field>
  </div>

  <app-day-view [date]="selectedDate()"></app-day-view>

  <app-data-density
    (dateChange)="onDateChange($event)"
    [year]="getFullYear(selectedDate())"
  ></app-data-density>
  <app-aqi-heatmap
    (dateChange)="onDateChange($event)"
    [year]="getFullYear(selectedDate())"
  ></app-aqi-heatmap>
</div>
